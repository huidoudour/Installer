name: PR compile build

on:
  pull_request:
    branches: [ master ]
    paths:
      - 'app/src/**'
      - 'app/build.gradle.kts'
      - 'app/CMakeLists.txt'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'

permissions:
  contents: read

jobs:
  build:
    name: Compile Kotlin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (full git history for version calculation)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle with cache
        uses: gradle/actions/setup-gradle@v6

      - name: Compile Kotlin sources
        run: |
          chmod +x gradlew
          ./gradlew :app:compileReleaseKotlin
