name: PR compile build

on:
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (full git history for version calculation)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get short commit hash
        id: short_hash
        run: echo "hash=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle with cache
        uses: gradle/actions/setup-gradle@v6

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Create signing keystore file
        run: |
          echo "${{ secrets.SIGN_KEY_STORE_B64 }}" | base64 -d > sign_key
          ls -lh sign_key
          file sign_key

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug \
            -Pandroid.injected.signing.store.file=$(pwd)/sign_key \
            -Pandroid.injected.signing.store.password="${{ secrets.SIGN_KEY_STORE_PASSWD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.SIGN_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.SIGN_KEY_ALIAS_PASSWD }}" \
            --stacktrace

      - name: Verify APK signature
        run: |
          echo "APK build completed. Files in output directory:"
          find app/build/outputs/apk/debug -name "*.apk" -type f -exec ls -lh {} \;

      - name: Upload debug folder as artifact
        uses: actions/upload-artifact@v7
        with:
          name: Installer-Debug-${{ steps.short_hash.outputs.hash }}
          # 上传 debug 输出目录下的全部产物：APK、output-metadata.json
          path: app/build/outputs/apk/debug/
          if-no-files-found: error

      - name: Clean up keystore
        if: always()
        run: rm -f sign_key
