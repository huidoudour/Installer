name: PR compile build

# 说明：本工作流仅用于 PR 阶段的编译构建验证（默认 debug 签名），
# 不参与也不影响正式发布；发布产物由 pre-release / release 工作流负责。

on:
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (full git history for version calculation)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get short commit hash
        id: short_hash
        run: echo "hash=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle with cache
        uses: gradle/actions/setup-gradle@v6

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      # PR 通常来自 fork，GitHub 不向 fork 的 pull_request 注入仓库 secrets，
      # 因此这里不做自定义签名，直接使用默认 debug keystore 编译验证。
      # 需要正式签名的打包由 pre-release / release 工作流（push/tag 触发）负责。
      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: List debug outputs
        run: |
          echo "APK build completed. Files in output directory:"
          find build/app/outputs/apk/debug -name "*.apk" -type f -exec ls -lh {} \;

      - name: Upload debug folder as artifact
        uses: actions/upload-artifact@v7
        with:
          name: Installer-Debug-${{ steps.short_hash.outputs.hash }}
          # 上传 debug 输出目录下的全部产物：APK、output-metadata.json
          path: build/app/outputs/apk/debug/
          if-no-files-found: error
