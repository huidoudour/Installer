name: Release Build

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g., v1.0)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Create keystore file
        run: |
          echo "${{ secrets.SIGN_KEY_STORE_B64 }}" | base64 -d > sign_key
          ls -lh sign_key
          file sign_key
      
      - name: Build Release APK
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/sign_key \
            -Pandroid.injected.signing.store.password="${{ secrets.SIGN_KEY_STORE_PASSWD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.SIGN_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.SIGN_KEY_ALIAS_PASSWD }}" \
            --stacktrace

      - name: Verify APK signature
        run: |
          echo "APK build completed. Files in output directory:"
          find app/build/outputs/apk/release -name "*.apk" -type f -exec ls -lh {} \;

      - name: Clean up keystore
        if: always()
        run: rm -f sign_key

      - name: Validate and prepare release tag
        run: |
          # 判断标签来源：推送标签使用 ref_name，手动触发使用 inputs
          if [ "${{ github.event_name }}" == "push" ]; then
            tag="${{ github.ref_name }}"
          else
            tag="${{ github.event.inputs.release_tag }}"
          fi
          # 检查tag是否包含无效字符
          if [[ ! "$tag" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo "Error: tag_name contains invalid characters. Use only alphanumeric, dots, hyphens, and underscores."
            exit 1
          fi
          echo "TAG_NAME=$tag" >> $GITHUB_ENV

      - name: Generate changelog from preceding tag
        id: changelog
        run: |
          CURRENT_TAG="${{ env.TAG_NAME }}"

          # 仅取纯数字版本号的正式 tag，排除 beta/rc/alpha/pre/test 等预发布标签
          TAGS=$(git tag --sort=-version:refname --list 'v*' | grep -E '^v[0-9]+(\.[0-9]+)*$')

          PREV_TAG=""
          if [ "${{ github.event_name }}" == "push" ]; then
            # 推送 tag 触发：找当前 tag 之前最近的一个正式 tag
            PREV_TAG=$(echo "$TAGS" | awk -v cur="$CURRENT_TAG" '$0==cur{found=1;next} found==1{print;exit}')
          fi
          # 手动触发或首个正式 tag 时，回退为最新的正式 tag
          if [ -z "$PREV_TAG" ]; then
            echo "No preceding stable tag found, falling back to latest stable tag."
            PREV_TAG=$(echo "$TAGS" | head -n1)
          fi

          echo "CURRENT_TAG=$CURRENT_TAG"
          echo "PREV_TAG=${PREV_TAG:-<none>}"

          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$CURRENT_TAG" ]; then
            COMMITS=$(git log --oneline --no-merges "$PREV_TAG..HEAD")
          else
            COMMITS=$(git log --oneline --no-merges)
          fi

          # 去掉 commit hash，仅保留提交描述，并生成 Markdown 列表
          FORMATTED=$(echo "$COMMITS" | sed -E 's/^[0-9a-f]{7,40}[[:space:]]+//' | sed 's/^/- /')

          echo "commits<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FORMATTED" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ## 更新内容
            ${{ steps.changelog.outputs.commits }}

            ### 安装说明
            下载并安装 APK 文件即可使用。
            
            > [!TIP]
            > 此app需要使用到ADB权限
            > 此app需要使用授予的设备所有者权限
      - name: Upload APKs to Release
        run: |
          assets_dir="app/build/outputs/apk/release"
          
          for apk in "$assets_dir"/*.apk; do
            if [ -f "$apk" ]; then
              echo "Uploading $(basename "$apk")..."
              gh release upload "${{ env.TAG_NAME }}" "$apk"
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
