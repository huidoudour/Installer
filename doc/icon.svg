<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
    <!-- 白色背景（ic_launcher_background 本身铺满 108dp，这里按启动器遮罩画成圆角以方便查看） -->
    <path fill="#FFFFFF" d="M24,0 H84 A24,24 0 0 1 108,24 V84 A24,24 0 0 1 84,108 H24 A24,24 0 0 1 0,84 V24 A24,24 0 0 1 24,0 Z"/>

    <!-- 底层斜片：樱花粉 -->
    <path fill="none" stroke="#FFB6C1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M31,65 L54,76 L77,65 L54,54 Z"/>

    <!-- 中层斜片：橙 -->
    <path fill="none" stroke="#FF9800" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M31,54 L54,65 L77,54 L54,43 Z"/>

    <!-- 安装箭头：圆头杆 + 开放 V 头，杆顶藏到蓝片后面 -->
    <path fill="none" stroke="#4CAF50" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" d="M54,39 V71 M54,71 L47,64 M54,71 L61,64"/>

    <!-- 顶层斜片：蓝（最前面的“框”，遮住箭头杆顶） -->
    <path fill="none" stroke="#2196F3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M31,43 L54,54 L77,43 L54,32 Z"/>
</svg>
